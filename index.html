<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SORT.EXE — Algorithm Visualizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0d0d0d;
            --surface: #141414;
            --border: #242424;
            --text: #e8e8e8;
            --muted: #555;
            --accent: #c8f04c;
            --accent-dim: rgba(200, 240, 76, 0.12);
            --comparing: #38bdf8;
            --swapping: #f472b6;
            --sorted: #4ade80;
            --pivot: #fbbf24;
            --bar-default: #2a2a2a;
            --label-color: #888;
        }

        [data-theme="light"] {
            --bg: #f5f5f0;
            --surface: #ffffff;
            --border: #d0d0c8;
            --text: #1a1a1a;
            --muted: #999;
            --accent: #5a8a00;
            --accent-dim: rgba(90, 138, 0, 0.1);
            --comparing: #0284c7;
            --swapping: #be185d;
            --sorted: #16a34a;
            --pivot: #d97706;
            --bar-default: #c0c0b8;
            --label-color: #555;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ─── Layout ─── */
        .app {
            display: grid;
            grid-template-rows: auto auto 1fr auto;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ─── Header ─── */
        header {
            padding: 40px 0 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 20px;
        }

        .logo {
            font-family: 'Space Mono', monospace;
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 700;
            color: var(--accent);
            letter-spacing: -1px;
        }

        .logo-dot { color: var(--muted); }

        .tagline {
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ─── Theme toggle ─── */
        .theme-toggle {
            margin-left: auto;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 7px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
        .theme-icon { font-size: 0.9rem; }

        /* ─── Controls ─── */
        .controls {
            padding: 28px 0;
            display: flex;
            flex-wrap: wrap;
            gap: 32px;
            align-items: flex-end;
            border-bottom: 1px solid var(--border);
        }

        .control-group { display: flex; flex-direction: column; gap: 10px; }

        .control-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Algorithm picker */
        .algo-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .algo-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 7px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
            white-space: nowrap;
        }

        .algo-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .algo-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #0d0d0d;
            font-weight: 700;
        }

        /* Sliders */
        .slider-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-val {
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
            color: var(--accent);
            min-width: 32px;
            text-align: right;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 140px;
            height: 2px;
            background: var(--border);
            outline: none;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        input[type="range"]::-moz-range-thumb {
            width: 14px;
            height: 14px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            cursor: pointer;
        }

        /* Action buttons */
        .actions { display: flex; gap: 8px; }

        .btn {
            padding: 9px 22px;
            font-family: 'Space Mono', monospace;
            font-size: 0.78rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 1px solid;
            background: transparent;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
        }

        .btn-start { border-color: var(--accent); color: var(--accent); }
        .btn-start:hover:not(:disabled) { background: var(--accent); color: #0d0d0d; }

        .btn-pause { border-color: var(--comparing); color: var(--comparing); }
        .btn-pause:hover:not(:disabled) { background: var(--comparing); color: #0d0d0d; }

        .btn-cancel { border-color: #ef4444; color: #ef4444; }
        .btn-cancel:hover:not(:disabled) { background: #ef4444; color: #0d0d0d; }

        .btn-reset { border-color: var(--border); color: var(--muted); }
        .btn-reset:hover:not(:disabled) { border-color: var(--text); color: var(--text); }

        .btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ─── Stats ─── */
        .stats {
            display: flex;
            gap: 0;
            border-bottom: 1px solid var(--border);
        }

        .stat {
            flex: 1;
            padding: 16px 20px;
            border-right: 1px solid var(--border);
        }

        .stat:last-child { border-right: none; }

        .stat-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.62rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'Space Mono', monospace;
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--text);
        }

        .stat-value.highlight { color: var(--accent); }

        /* ─── Visualization ─── */
        .vis-wrap {
            padding: 32px 0 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        #canvas {
            width: 100%;
            height: clamp(300px, 45vh, 500px);
            display: flex;
            align-items: flex-end;
            gap: 1px;
            padding-top: 24px;
        }

        .bar {
            flex: 1;
            border-radius: 2px 2px 0 0;
            transition: height 0.05s ease, background 0.05s;
            background: var(--bar-default);
            min-width: 1px;
            position: relative;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .bar-label {
            position: absolute;
            top: -18px;
            font-family: 'Space Mono', monospace;
            font-size: 9px;
            color: var(--label-color);
            white-space: nowrap;
            display: none;
            user-select: none;
        }

        .show-labels .bar-label { display: block; }

        .bar.comparing { background: var(--comparing); }
        .bar.swapping   { background: var(--swapping); }
        .bar.sorted     { background: var(--sorted); }
        .bar.pivot      { background: var(--pivot); }

        /* ─── Legend ─── */
        .legend {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.72rem;
            color: var(--muted);
            font-family: 'Space Mono', monospace;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ─── Footer ─── */
        footer {
            padding: 20px 0;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .footer-text {
            font-family: 'Space Mono', monospace;
            font-size: 0.65rem;
            color: var(--muted);
            letter-spacing: 1px;
        }

        /* ─── Complexity badge ─── */
        .complexity-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: var(--accent-dim);
            border: 1px solid var(--accent);
            border-radius: 100px;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            opacity: 0;
            transition: opacity 0.3s;
        }

        .complexity-badge.visible { opacity: 1; }

        /* ─── View Mode Toggle ─── */
        .view-mode-bar {
            display: flex;
            gap: 6px;
            align-items: center;
            padding: 14px 0 0;
        }
        .view-mode-label {
            font-family: 'Space Mono', monospace;
            font-size: 0.68rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-right: 6px;
        }
        .view-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 6px 14px;
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.15s;
        }
        .view-btn:hover { border-color: var(--accent); color: var(--accent); }
        .view-btn.active { background: var(--accent); border-color: var(--accent); color: #0d0d0d; font-weight: 700; }

        /* ─── Array View ─── */
        #arrayCanvas {
            display: none;
            flex-direction: column;
            gap: 0;
            width: 100%;
            overflow-x: auto;
            padding: 40px 0 20px;
            position: relative;
            min-height: 160px;
        }
        #arrayCanvas.active { display: flex; }
        #canvas.hidden { display: none; }

        .array-row {
            display: flex;
            align-items: stretch;
            position: relative;
        }

        .array-cell {
            min-width: 44px;
            height: 44px;
            border: 1.5px solid var(--border);
            border-right: none;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text);
            background: var(--surface);
            position: relative;
            transition: background 0.1s, color 0.1s, border-color 0.1s, transform 0.12s;
            flex-shrink: 0;
            user-select: none;
        }
        .array-cell:last-child { border-right: 1.5px solid var(--border); }
        .array-cell.comparing {
            background: var(--comparing);
            color: #0d0d0d;
            border-color: var(--comparing);
        }
        .array-cell.swapping {
            background: var(--swapping);
            color: #0d0d0d;
            border-color: var(--swapping);
            transform: translateY(-6px);
        }
        .array-cell.sorted {
            background: var(--sorted);
            color: #0d0d0d;
            border-color: var(--sorted);
        }
        .array-cell.pivot {
            background: var(--pivot);
            color: #0d0d0d;
            border-color: var(--pivot);
        }

        .index-row {
            display: flex;
        }
        .array-index {
            min-width: 44px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Mono', monospace;
            font-size: 0.58rem;
            color: var(--muted);
            flex-shrink: 0;
        }

        /* ─── Pointer/Arrow layer ─── */
        .pointer-layer {
            position: relative;
            height: 56px;
            width: 100%;
        }
        .pointer-svg {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        /* responsive */
        @media (max-width: 700px) {
            .controls { gap: 20px; }
            input[type="range"] { width: 100px; }
            .stats { flex-wrap: wrap; }
            .stat { min-width: 50%; border-bottom: 1px solid var(--border); }
        }
    </style>
</head>
<body>
<div class="app">

    <header>
        <div class="logo">SORT<span class="logo-dot">.</span>EXE</div>
        <div class="tagline">Algorithm Visualizer</div>
        <button class="theme-toggle" id="themeToggle">
            <span class="theme-icon">☀️</span><span id="themeLabel">Light</span>
        </button>
    </header>

    <div class="controls">
        <!-- Algorithm -->
        <div class="control-group" style="flex:1; min-width:280px;">
            <div class="control-label">Algorithm</div>
            <div class="algo-list" id="algoList">
                <button class="algo-btn" data-algo="bubble"    data-complexity="O(n²)">Bubble</button>
                <button class="algo-btn" data-algo="selection" data-complexity="O(n²)">Selection</button>
                <button class="algo-btn" data-algo="insertion" data-complexity="O(n²)">Insertion</button>
                <button class="algo-btn" data-algo="merge"     data-complexity="O(n log n)">Merge</button>
                <button class="algo-btn" data-algo="quick"     data-complexity="O(n log n) avg">Quick</button>
                <button class="algo-btn" data-algo="heap"      data-complexity="O(n log n)">Heap</button>
                <button class="algo-btn" data-algo="shell"     data-complexity="O(n log² n)">Shell</button>
            </div>
        </div>

        <!-- Array size -->
        <div class="control-group">
            <div class="control-label">Array Size</div>
            <div class="slider-row">
                <input type="range" id="sizeSlider" min="10" max="30" value="30">
                <span class="slider-val" id="sizeVal">30</span>
            </div>
        </div>

        <!-- Speed -->
        <div class="control-group">
            <div class="control-label">Delay (ms)</div>
            <div class="slider-row">
                <input type="range" id="speedSlider" min="1" max="200" value="40">
                <span class="slider-val" id="speedVal">40</span>
            </div>
        </div>

        <!-- Buttons -->
        <div class="control-group">
            <div class="control-label">&nbsp;</div>
            <div class="actions">
                <button class="btn btn-start" id="startBtn">Start</button>
                <button class="btn btn-pause" id="pauseBtn" disabled>Pause</button>
                <button class="btn btn-cancel" id="cancelBtn" disabled>Cancel</button>
                <button class="btn btn-reset" id="resetBtn">Reset</button>
            </div>
        </div>
    </div>

    <!-- Stats -->
    <div class="stats">
        <div class="stat">
            <div class="stat-label">Algorithm</div>
            <div class="stat-value highlight" id="statAlgo">—</div>
        </div>
        <div class="stat">
            <div class="stat-label">Complexity</div>
            <div class="stat-value" id="statComplexity">—</div>
        </div>
        <div class="stat">
            <div class="stat-label">Comparisons</div>
            <div class="stat-value" id="statComparisons">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Array Accesses</div>
            <div class="stat-value" id="statAccess">0</div>
        </div>
        <div class="stat">
            <div class="stat-label">Time (ms)</div>
            <div class="stat-value" id="statTime">0</div>
        </div>
    </div>

    <!-- Visualization -->
    <div class="vis-wrap">
        <div class="view-mode-bar">
            <span class="view-mode-label">View</span>
            <button class="view-btn active" id="viewBars">Bar Chart</button>
            <button class="view-btn" id="viewArray">Array</button>
        </div>
        <div id="canvas"></div>
        <div id="arrayCanvas">
            <div class="pointer-layer"><svg class="pointer-svg" id="pointerSvg"></svg></div>
            <div class="array-row" id="arrayCells"></div>
            <div class="index-row" id="arrayIndices"></div>
        </div>
        <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:#2a2a2a;border:1px solid #555"></div>Unsorted</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--comparing)"></div>Comparing</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--swapping)"></div>Swapping</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--pivot)"></div>Pivot</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--sorted)"></div>Sorted</div>
        </div>
    </div>

    <footer>
        <div class="footer-text">SORT.EXE — ALGORITHM VISUALIZER</div>
        <div class="footer-text">© 2026</div>
    </footer>

</div>

<script>
class SortingVisualizer {
    constructor() {
        this.array = [];
        this.arraySize = 30;
        this.speed = 40;
        this.selectedAlgo = null;
        this.selectedComplexity = null;
        this.sorting = false;
        this.paused = false;
        this.cancelled = false;
        this.stats = { comparisons: 0, access: 0, startTime: 0 };

        this.$canvas    = document.getElementById('canvas');
        this.$sizeSlider  = document.getElementById('sizeSlider');
        this.$speedSlider = document.getElementById('speedSlider');
        this.$sizeVal   = document.getElementById('sizeVal');
        this.$speedVal  = document.getElementById('speedVal');
        this.$startBtn  = document.getElementById('startBtn');
        this.$pauseBtn  = document.getElementById('pauseBtn');
        this.$cancelBtn = document.getElementById('cancelBtn');
        this.$resetBtn  = document.getElementById('resetBtn');

        this._bindEvents();
        this.generateArray();
    }

    _bindEvents() {
        this.$sizeSlider.addEventListener('input', e => {
            this.arraySize = +e.target.value;
            this.$sizeVal.textContent = this.arraySize;
            if (!this.sorting) { this.generateArray(); this._rebuildBars(); }
        });
        this.$speedSlider.addEventListener('input', e => {
            this.speed = +e.target.value;
            this.$speedVal.textContent = this.speed;
        });
        document.getElementById('algoList').addEventListener('click', e => {
            const btn = e.target.closest('.algo-btn');
            if (!btn || this.sorting) return;
            document.querySelectorAll('.algo-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            this.selectedAlgo = btn.dataset.algo;
            this.selectedComplexity = btn.dataset.complexity;
            document.getElementById('statAlgo').textContent = btn.textContent.trim();
            document.getElementById('statComplexity').textContent = this.selectedComplexity;
        });
        this.$startBtn.addEventListener('click', () => this.start());
        this.$pauseBtn.addEventListener('click', () => this.togglePause());
        this.$cancelBtn.addEventListener('click', () => this.cancel());
        this.$resetBtn.addEventListener('click', () => this.reset());
    }

    generateArray() {
        this.array = Array.from({ length: this.arraySize }, () =>
            Math.floor(Math.random() * 380) + 20
        );
        this.render();
    }

    render(comparing = [], swapping = [], sorted = [], pivot = -1) {
        const bars = this.$canvas.querySelectorAll('.bar');
        this.array.forEach((val, i) => {
            const bar = bars[i];
            if (!bar) return;
            bar.style.height = `${(val / 400) * 100}%`;
            bar.className = 'bar';
            const label = bar.querySelector('.bar-label');
            if (label) label.textContent = val;
            if (sorted.includes(i))        bar.classList.add('sorted');
            else if (pivot === i)           bar.classList.add('pivot');
            else if (swapping.includes(i))  bar.classList.add('swapping');
            else if (comparing.includes(i)) bar.classList.add('comparing');
        });
    }

    _rebuildBars() {
        this.$canvas.innerHTML = '';
        this.$canvas.classList.toggle('show-labels', this.arraySize <= 50);
        this.array.forEach(val => {
            const bar = document.createElement('div');
            bar.className = 'bar';
            const label = document.createElement('span');
            label.className = 'bar-label';
            label.textContent = val;
            bar.appendChild(label);
            this.$canvas.appendChild(bar);
        });
        this.render();
    }

    sleep(ms) {
        return new Promise(resolve => {
            const tick = () => {
                if (this.cancelled) return resolve();
                if (this.paused) return setTimeout(tick, 100);
                setTimeout(resolve, ms);
            };
            tick();
        });
    }

    updateStats() {
        document.getElementById('statComparisons').textContent = this.stats.comparisons;
        document.getElementById('statAccess').textContent = this.stats.access;
        document.getElementById('statTime').textContent = Math.floor(Date.now() - this.stats.startTime);
    }

    async start() {
        if (!this.selectedAlgo || this.sorting) return;
        this.sorting = true;
        this.paused = false;
        this.cancelled = false;
        this.stats = { comparisons: 0, access: 0, startTime: Date.now() };
        this.$startBtn.disabled = true;
        this.$pauseBtn.disabled = false;
        this.$cancelBtn.disabled = false;
        this.$resetBtn.disabled = true;

        const map = {
            bubble: () => this.bubbleSort(),
            selection: () => this.selectionSort(),
            insertion: () => this.insertionSort(),
            merge: () => this.mergeSort(),
            quick: () => this.quickSort(),
            heap: () => this.heapSort(),
            shell: () => this.shellSort(),
        };
        await map[this.selectedAlgo]();
        if (this.cancelled) return this._finish();
        await this.showSortedWave();
        if (this.cancelled) return this._finish();
        this._finish();
    }

    async showSortedWave() {
        for (let i = 0; i < this.array.length; i++) {
            if (this.cancelled) return;
            this.render([], [], Array.from({ length: i + 1 }, (_, k) => k));
            await this.sleep(8);
        }
    }

    _finish() {
        this.sorting = false;
        this.paused = false;
        this.$startBtn.disabled = false;
        this.$pauseBtn.disabled = true;
        this.$pauseBtn.textContent = 'Pause';
        this.$cancelBtn.disabled = true;
        this.$resetBtn.disabled = false;
        this.updateStats();
    }

    togglePause() {
        this.paused = !this.paused;
        this.$pauseBtn.textContent = this.paused ? 'Resume' : 'Pause';
    }

    cancel() {
        if (!this.sorting) return;
        this.cancelled = true;
        this.paused = false;
        this.$pauseBtn.textContent = 'Pause';
        this._finish();
    }

    reset() {
        this.sorting = false;
        this.paused = false;
        this.cancelled = false;
        this.$startBtn.disabled = false;
        this.$pauseBtn.disabled = true;
        this.$pauseBtn.textContent = 'Pause';
        this.$cancelBtn.disabled = true;
        this.$resetBtn.disabled = false;
        this.stats = { comparisons: 0, access: 0, startTime: 0 };
        this.updateStats();
        this.generateArray();
        this._rebuildBars();
    }

    // ─── Algorithms ───

    async bubbleSort() {
        const n = this.array.length;
        for (let i = 0; i < n - 1; i++) {
            if (this.cancelled) return;
            for (let j = 0; j < n - i - 1; j++) {
                if (this.cancelled) return;
                this.stats.comparisons++; this.stats.access += 2;
                this.render([j, j + 1]);
                await this.sleep(this.speed);
                if (this.cancelled) return;
                if (this.array[j] > this.array[j + 1]) {
                    this.render([], [j, j + 1]);
                    await this.sleep(this.speed);
                    [this.array[j], this.array[j + 1]] = [this.array[j + 1], this.array[j]];
                    this.stats.access += 4;
                }
                this.updateStats();
            }
        }
    }

    async selectionSort() {
        const n = this.array.length;
        for (let i = 0; i < n; i++) {
            if (this.cancelled) return;
            let min = i;
            for (let j = i + 1; j < n; j++) {
                if (this.cancelled) return;
                this.stats.comparisons++; this.stats.access += 2;
                this.render([min, j], [], Array.from({ length: i }, (_, k) => k));
                await this.sleep(this.speed);
                if (this.cancelled) return;
                if (this.array[j] < this.array[min]) min = j;
                this.updateStats();
            }
            if (min !== i) {
                this.render([], [i, min], Array.from({ length: i }, (_, k) => k));
                await this.sleep(this.speed);
                if (this.cancelled) return;
                [this.array[i], this.array[min]] = [this.array[min], this.array[i]];
                this.stats.access += 4;
            }
        }
    }

    async insertionSort() {
        const n = this.array.length;
        for (let i = 1; i < n; i++) {
            if (this.cancelled) return;
            let key = this.array[i], j = i - 1;
            this.stats.access++;
            while (j >= 0 && this.array[j] > key) {
                this.stats.comparisons++; this.stats.access += 2;
                this.render([j, j + 1]);
                await this.sleep(this.speed);
                if (this.cancelled) return;
                this.array[j + 1] = this.array[j];
                this.stats.access += 2;
                j--;
                this.updateStats();
            }
            this.array[j + 1] = key;
            this.stats.access++;
        }
    }

    async mergeSort() { await this._mergeSplit(0, this.array.length - 1); }

    async _mergeSplit(l, r) {
        if (this.cancelled || l >= r) return;
        const m = Math.floor((l + r) / 2);
        await this._mergeSplit(l, m);
        await this._mergeSplit(m + 1, r);
        await this._merge(l, m, r);
    }

    async _merge(l, m, r) {
        if (this.cancelled) return;
        const L = this.array.slice(l, m + 1);
        const R = this.array.slice(m + 1, r + 1);
        let i = 0, j = 0, k = l;
        while (i < L.length && j < R.length) {
            this.stats.comparisons++; this.stats.access += 2;
            this.render([l + i, m + 1 + j]);
            await this.sleep(this.speed);
            if (this.cancelled) return;
            this.array[k++] = L[i] <= R[j] ? (i++, L[i - 1]) : (j++, R[j - 1]);
            this.stats.access++;
            this.updateStats();
        }
        while (i < L.length) { this.array[k++] = L[i++]; this.stats.access++; }
        while (j < R.length) { this.array[k++] = R[j++]; this.stats.access++; }
    }

    async quickSort() { await this._quickSplit(0, this.array.length - 1); }

    async _quickSplit(lo, hi) {
        if (this.cancelled || lo >= hi) return;
        const p = await this._partition(lo, hi);
        await this._quickSplit(lo, p - 1);
        await this._quickSplit(p + 1, hi);
    }

    async _partition(lo, hi) {
        if (this.cancelled) return lo;
        const pivot = this.array[hi];
        this.stats.access++;
        let i = lo - 1;
        for (let j = lo; j < hi; j++) {
            this.stats.comparisons++; this.stats.access++;
            this.render([j], [], [], hi);
            await this.sleep(this.speed);
            if (this.cancelled) return lo;
            if (this.array[j] < pivot) {
                i++;
                this.render([], [i, j], [], hi);
                await this.sleep(this.speed);
                if (this.cancelled) return lo;
                [this.array[i], this.array[j]] = [this.array[j], this.array[i]];
                this.stats.access += 4;
            }
            this.updateStats();
        }
        [this.array[i + 1], this.array[hi]] = [this.array[hi], this.array[i + 1]];
        this.stats.access += 4;
        return i + 1;
    }

    async heapSort() {
        const n = this.array.length;
        for (let i = Math.floor(n / 2) - 1; i >= 0; i--) {
            if (this.cancelled) return;
            await this._heapify(n, i);
        }
        for (let i = n - 1; i > 0; i--) {
            if (this.cancelled) return;
            this.render([], [0, i]);
            await this.sleep(this.speed);
            if (this.cancelled) return;
            [this.array[0], this.array[i]] = [this.array[i], this.array[0]];
            this.stats.access += 4;
            await this._heapify(i, 0);
            this.updateStats();
        }
    }

    async _heapify(n, i) {
        if (this.cancelled) return;
        let largest = i, l = 2 * i + 1, r = 2 * i + 2;
        if (l < n) { this.stats.comparisons++; this.stats.access += 2; if (this.array[l] > this.array[largest]) largest = l; }
        if (r < n) { this.stats.comparisons++; this.stats.access += 2; if (this.array[r] > this.array[largest]) largest = r; }
        if (largest !== i) {
            this.render([], [i, largest]);
            await this.sleep(this.speed);
            if (this.cancelled) return;
            [this.array[i], this.array[largest]] = [this.array[largest], this.array[i]];
            this.stats.access += 4;
            await this._heapify(n, largest);
        }
        this.updateStats();
    }

    async shellSort() {
        const n = this.array.length;
        for (let gap = Math.floor(n / 2); gap > 0; gap = Math.floor(gap / 2)) {
            if (this.cancelled) return;
            for (let i = gap; i < n; i++) {
                if (this.cancelled) return;
                const temp = this.array[i]; this.stats.access++;
                let j = i;
                while (j >= gap && this.array[j - gap] > temp) {
                    this.stats.comparisons++; this.stats.access += 2;
                    this.render([j, j - gap]);
                    await this.sleep(this.speed);
                    if (this.cancelled) return;
                    this.array[j] = this.array[j - gap];
                    this.stats.access += 2;
                    j -= gap;
                    this.updateStats();
                }
                this.array[j] = temp; this.stats.access++;
            }
        }
    }
}

// ─── Array + Pointer View ───
class ArrayViewRenderer {
    constructor(visualizer) {
        this.viz = visualizer;
        this.$cells   = document.getElementById('arrayCells');
        this.$indices = document.getElementById('arrayIndices');
        this.$svg     = document.getElementById('pointerSvg');
        this.cellWidth = 44;
        this.CELL_H    = 44;
    }

    // Decide cell width based on array size
    _calcCellWidth() {
        const n = this.viz.array.length;
        if (n <= 20)  return 56;
        if (n <= 40)  return 44;
        if (n <= 70)  return 34;
        if (n <= 100) return 26;
        return 20;
    }

    rebuild() {
        const n = this.viz.array.length;
        this.cellWidth = this._calcCellWidth();
        const cw = this.cellWidth;

        // Cells
        this.$cells.innerHTML = '';
        this.$indices.innerHTML = '';
        this.viz.array.forEach((val, i) => {
            const cell = document.createElement('div');
            cell.className = 'array-cell';
            cell.style.minWidth = cw + 'px';
            cell.style.fontSize = cw < 30 ? '0.6rem' : (cw < 40 ? '0.68rem' : '0.75rem');
            cell.textContent = val;
            this.$cells.appendChild(cell);

            const idx = document.createElement('div');
            idx.className = 'array-index';
            idx.style.minWidth = cw + 'px';
            // Show every index if small, else every N
            const step = cw < 28 ? Math.ceil(n / 20) : 1;
            idx.textContent = (i % step === 0) ? i : '';
            this.$indices.appendChild(idx);
        });
        this._clearPointers();
    }

    render(comparing = [], swapping = [], sorted = [], pivot = -1, extraPointers = {}) {
        const cells = this.$cells.querySelectorAll('.array-cell');
        this.viz.array.forEach((val, i) => {
            const cell = cells[i];
            if (!cell) return;
            cell.textContent = val;
            cell.className = 'array-cell';
            cell.style.minWidth = this.cellWidth + 'px';
            cell.style.fontSize = this.cellWidth < 30 ? '0.6rem' : (this.cellWidth < 40 ? '0.68rem' : '0.75rem');
            if (sorted.includes(i))        cell.classList.add('sorted');
            else if (pivot === i)          cell.classList.add('pivot');
            else if (swapping.includes(i)) cell.classList.add('swapping');
            else if (comparing.includes(i) ) cell.classList.add('comparing');
        });
        this._drawPointers(comparing, swapping, pivot, extraPointers);
    }

    _clearPointers() { this.$svg.innerHTML = ''; }

    _drawPointers(comparing, swapping, pivot, extra) {
        this.$svg.innerHTML = '';
        const cw   = this.cellWidth;
        const svgH = 56;
        const midY = svgH * 0.55;

        const pointers = [];

        // Comparing pointers (blue arrows, above)
        comparing.forEach((idx, k) => {
            pointers.push({ idx, color: 'var(--comparing)', label: k === 0 ? 'i' : 'j', side: 'top' });
        });
        // Swapping (pink)
        swapping.forEach((idx, k) => {
            pointers.push({ idx, color: 'var(--swapping)', label: k === 0 ? 'swap' : '↔', side: 'top' });
        });
        // Pivot
        if (pivot >= 0) {
            pointers.push({ idx: pivot, color: 'var(--pivot)', label: 'pivot', side: 'top' });
        }
        // Extra named pointers
        Object.entries(extra).forEach(([label, idx]) => {
            if (idx >= 0) pointers.push({ idx, color: 'var(--accent)', label, side: 'top' });
        });

        // Group by index to stack labels
        const byIdx = {};
        pointers.forEach(p => {
            if (!byIdx[p.idx]) byIdx[p.idx] = [];
            byIdx[p.idx].push(p);
        });

        Object.entries(byIdx).forEach(([rawIdx, pts]) => {
            const idx = parseInt(rawIdx);
            // center of cell
            const cx = idx * cw + cw / 2;

            pts.forEach((p, stack) => {
                const arrowTipY = svgH; // touches top of cell row
                const stemTopY  = arrowTipY - 18 - stack * 18;
                const labelY    = stemTopY - 4;

                // Vertical stem
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', cx); line.setAttribute('y1', stemTopY);
                line.setAttribute('x2', cx); line.setAttribute('y2', arrowTipY - 6);
                line.setAttribute('stroke', p.color);
                line.setAttribute('stroke-width', '2');
                this.$svg.appendChild(line);

                // Arrowhead
                const arrow = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                const ax = cx, ay = arrowTipY;
                arrow.setAttribute('points', `${ax},${ay} ${ax-5},${ay-8} ${ax+5},${ay-8}`);
                arrow.setAttribute('fill', p.color);
                this.$svg.appendChild(arrow);

                // Label
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.setAttribute('x', cx);
                text.setAttribute('y', labelY);
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('font-family', 'Space Mono, monospace');
                text.setAttribute('font-size', '10');
                text.setAttribute('fill', p.color);
                text.setAttribute('font-weight', '700');
                text.textContent = p.label;
                this.$svg.appendChild(text);
            });
        });
    }
}

// ─── Patch SortingVisualizer to support dual-mode rendering ───
const _origRender = SortingVisualizer.prototype.render;
SortingVisualizer.prototype.render = function(comparing = [], swapping = [], sorted = [], pivot = -1) {
    _origRender.call(this, comparing, swapping, sorted, pivot);
    if (this._arrayView && this._arrayViewMode) {
        this._arrayView.render(comparing, swapping, sorted, pivot);
    }
};

const _origRebuild = SortingVisualizer.prototype._rebuildBars;
SortingVisualizer.prototype._rebuildBars = function() {
    _origRebuild.call(this);
    if (this._arrayView && this._arrayViewMode) {
        this._arrayView.rebuild();
        this._arrayView.render();
    }
};

// Init after DOM ready
window.addEventListener('DOMContentLoaded', () => {
    const viz = new SortingVisualizer();
    viz._rebuildBars();

    // Array view renderer
    const arrayView = new ArrayViewRenderer(viz);
    viz._arrayView = arrayView;
    viz._arrayViewMode = false;

    // View mode buttons
    const btnBars  = document.getElementById('viewBars');
    const btnArray = document.getElementById('viewArray');
    const $canvas  = document.getElementById('canvas');
    const $arrCnv  = document.getElementById('arrayCanvas');

    function switchView(mode) {
        viz._arrayViewMode = mode === 'array';
        btnBars.classList.toggle('active', mode === 'bars');
        btnArray.classList.toggle('active', mode === 'array');
        $canvas.classList.toggle('hidden', mode === 'array');
        $arrCnv.classList.toggle('active', mode === 'array');
        if (mode === 'array') {
            arrayView.rebuild();
            arrayView.render();
        }
    }

    btnBars.addEventListener('click',  () => switchView('bars'));
    btnArray.addEventListener('click', () => switchView('array'));

    // Theme toggle
    const themeToggle = document.getElementById('themeToggle');
    const themeLabel  = document.getElementById('themeLabel');
    themeToggle.addEventListener('click', () => {
        const isLight = document.documentElement.getAttribute('data-theme') === 'light';
        if (isLight) {
            document.documentElement.removeAttribute('data-theme');
            themeToggle.querySelector('.theme-icon').textContent = '☀️';
            themeLabel.textContent = 'Light';
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            themeToggle.querySelector('.theme-icon').textContent = '🌙';
            themeLabel.textContent = 'Dark';
        }
    });
});
</script>
